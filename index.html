<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doyz AI Downloader</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #09090b;
            --bg-card: #18181b;
            --primary: #8b5cf6; 
            --border-color: #27272a;
        }

        body {
            background-color: var(--bg-base);
            color: #fafafa;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.1), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.1), transparent 30%);
        }

        .fade-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        .glass-card {
            background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5); border-radius: 24px;
        }

        .input-modern {
            background: #09090b; border: 1px solid var(--border-color); color: white;
            border-radius: 16px; padding: 16px 20px; width: 100%; font-size: 14px; outline: none; transition: all 0.3s ease;
        }
        .input-modern:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15); }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #6d28d9); color: white; font-weight: 800;
            border-radius: 16px; padding: 16px; width: 100%; border: none; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); display: flex; justify-content: center; align-items: center; gap: 8px;
            position: relative; overflow: hidden; text-decoration: none;
        }
        .btn-primary:active { transform: scale(0.96); }

        .loader-box { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px 0; }
        .loader-box.active { display: flex; }
        .spinner { 
            width: 50px; height: 50px; border: 4px solid rgba(139, 92, 246, 0.1); border-top: 4px solid var(--primary); 
            border-radius: 50%; animation: spin 1s linear infinite; box-shadow: 0 0 15px rgba(139,92,246,0.3);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .result-section { display: none; opacity: 0; transform: scale(0.95); transition: all 0.5s ease; }
        .result-section.show { display: flex; opacity: 1; transform: scale(1); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; border-radius: 16px; padding: 14px; width: 100%; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; text-decoration: none;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="items-center p-5">

    <main class="w-full max-w-md mx-auto mt-10 flex flex-col gap-6 z-10">
        
        <div class="text-center fade-up">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-purple-500 to-indigo-600 shadow-lg shadow-purple-500/30 mb-4 animate-bounce">
                <span class="material-icons-round text-3xl text-white">auto_awesome</span>
            </div>
            <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400 tracking-tight">Doyz Downloader</h1>
            <p class="text-xs text-gray-400 mt-2 font-medium">Support TikTok, IG, YouTube, FB.</p>
        </div>

        <div class="glass-card p-6 fade-up delay-1">
            <label class="text-[11px] font-bold text-gray-400 tracking-wider mb-2 block uppercase">Tempel Link</label>
            <div class="relative mb-5">
                <span class="material-icons-round absolute left-4 top-4 text-gray-500 text-lg">link</span>
                <input type="text" id="urlInput" class="input-modern pl-12" placeholder="https://..." autocomplete="off">
            </div>
            <button onclick="executeDownload()" id="btnExec" class="btn-primary">
                <span class="material-icons-round text-lg">rocket_launch</span> DOWNLOAD NOW
            </button>
        </div>

        <div id="loadingArea" class="loader-box fade-up">
            <div class="spinner mb-4"></div>
            <p class="text-sm font-bold text-[var(--primary)] animate-pulse" id="loadingText">Memproses link...</p>
        </div>

        <div id="resultArea" class="result-section flex-col gap-4 w-full glass-card p-5">
            <div class="flex items-center gap-2 mb-2 fade-up delay-1">
                <span class="material-icons-round text-green-500">check_circle</span>
                <span class="text-sm font-bold text-green-500">Berhasil Diekstrak!</span>
            </div>
            <div id="mediaContainer" class="w-full rounded-xl overflow-hidden border border-gray-800 bg-black relative fade-up delay-2">
                <!-- Video / Image masuk sini -->
            </div>
            <div class="flex flex-col gap-3 mt-2 fade-up delay-3">
                <a id="dlVideoBtn" href="#" download="video_doyz.mp4" class="btn-primary" style="background: linear-gradient(135deg, #22c55e, #16a34a);">
                    <span class="material-icons-round">download</span> SIMPAN KE GALERI (MP4)
                </a>
                <a id="dlAudioBtn" href="#" download="audio_doyz.mp3" class="btn-secondary">
                    <span class="material-icons-round text-purple-400">audiotrack</span> SIMPAN AUDIO (MP3)
                </a>
            </div>
        </div>

    </main>

    <script>
        // Fungsi delay buat jeda loading
        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function executeDownload() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return alert("Masukin link dulu BOS!");

            const btn = document.getElementById('btnExec');
            const loading = document.getElementById('loadingArea');
            const loadingText = document.getElementById('loadingText');
            const resultArea = document.getElementById('resultArea');
            const mediaContainer = document.getElementById('mediaContainer');
            const dlVideo = document.getElementById('dlVideoBtn');
            const dlAudio = document.getElementById('dlAudioBtn');

            // Reset
            btn.disabled = true;
            btn.innerHTML = '<span class="material-icons-round animate-spin">sync</span> PROCESSING...';
            loading.classList.add('active');
            resultArea.classList.remove('show');
            mediaContainer.innerHTML = '';
            dlAudio.style.display = 'none';

            const texts = ["Mengekstrak Media...", "Mencari Kualitas HD...", "Menyiapkan Link Download..."];
            let textIdx = 0;
            const txtInterval = setInterval(() => {
                loadingText.innerText = texts[textIdx];
                textIdx = (textIdx + 1) % texts.length;
            }, 1000);

            try {
                const isYouTube = url.includes('youtu');
                let videoUrl = "";
                let audioUrl = "";

                if (isYouTube) {
                    // --- API YOUTUBE (LOADING 3 DETIK) ---
                    // Kita pake API publik loadin buat YouTube
                    await delay(3000); // <--- JEDA 3 DETIK DISINI
                    
                    const res = await fetch(`https://api.vevioz.com/api/button/mp4/${encodeURIComponent(url)}`);
                    const textData = await res.text();
                    
                    if(textData.includes('http')) {
                        videoUrl = textData.trim(); 
                        audioUrl = textData.trim(); 
                    } else {
                        throw new Error("Server YouTube API sibuk, coba lagi.");
                    }

                } else {
                    // --- API TIKTOK/IG (LOADING 2 DETIK) ---
                    await delay(2000); 
                    
                    const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}&hd=1`);
                    const data = await res.json();
                    
                    if(data.code === 0 && data.data) {
                        const r = data.data;
                        videoUrl = r.hdplay || r.play;
                        if(r.music_info && r.music_info.play) audioUrl = r.music_info.play;
                    } else {
                        throw new Error("Link tidak valid atau private.");
                    }
                }

                clearInterval(txtInterval);

                if (videoUrl) {
                    // Tampilkan Video
                    mediaContainer.innerHTML = `<video controls playsinline class="w-full max-h-[300px] object-contain" src="${videoUrl}"></video>`;
                    
                    // Set Tombol Download (Langsung Save)
                    dlVideo.href = videoUrl;
                    dlVideo.setAttribute('download', 'doyz_video_' + Date.now() + '.mp4');
                    
                    if (audioUrl) {
                        dlAudio.href = audioUrl;
                        dlAudio.setAttribute('download', 'doyz_audio_' + Date.now() + '.mp3');
                        dlAudio.style.display = 'flex';
                    }
                    
                    resultArea.classList.add('show');
                    resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }

            } catch (error) {
                clearInterval(txtInterval);
                loadingText.innerText = "ERROR: " + error.message;
                loadingText.classList.add('text-red-500');
                setTimeout(() => {
                    loadingText.classList.remove('text-red-500');
                    loading.classList.remove('active');
                    btn.disabled = false;
                    btn.innerHTML = '<span class="material-icons-round">rocket_launch</span> DOWNLOAD NOW';
                }, 3000);
            } finally {
                if(!resultArea.classList.contains('show')) {
                    setTimeout(() => {
                        loading.classList.remove('active');
                        btn.disabled = false;
                        btn.innerHTML = '<span class="material-icons-round">rocket_launch</span> DOWNLOAD NOW';
                    }, 2000);
                }
            }
        }
    </script>
</body>
</html>
