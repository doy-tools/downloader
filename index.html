<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOYZ // SOCIAL GRID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon: #00ff41; 
            --dark: #050505; 
            --panel: #111;
        }

        body { 
            background-color: var(--dark); 
            color: white; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(0, 255, 65, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Efek Scanline & Glitch */
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            opacity: 0.8;
        }

        /* Animasi Kotak Sosmed */
        .social-card {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 255, 65, 0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .social-card:hover {
            border-color: var(--neon);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.4);
            transform: translateY(-5px) scale(1.02);
        }

        .social-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.2), transparent);
            transition: 0.5s;
        }

        .social-card:hover::before {
            left: 100%;
        }

        .icon-box {
            filter: drop-shadow(0 0 5px var(--neon));
        }

        /* Animasi Muncul */
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Delay Animasi */
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }
        .delay-6 { animation-delay: 0.6s; }

        /* Text Glow */
        .text-glow {
            text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon);
        }

    </style>
</head>
<body class="scanlines h-screen flex flex-col items-center justify-center p-6">

    <!-- Header -->
    <div class="text-center mb-10 fade-in-up">
        <h1 class="text-3xl font-black text-glow text-[var(--neon)] tracking-widest mb-2">SOCIAL GRID</h1>
        <p class="text-xs text-gray-400 font-mono">CONNECTING TO DOYZ NETWORK...</p>
    </div>

    <!-- Grid Sosmed -->
    <div class="grid grid-cols-2 gap-4 w-full max-w-md z-10">
        
        <!-- TikTok -->
        <a href="https://tiktok.com/@plermelayang" target="_blank" class="social-card p-5 rounded-2xl flex flex-col items-center justify-center gap-3 fade-in-up delay-1">
            <span class="material-icons-round text-4xl text-white icon-box">music_note</span>
            <span class="text-sm font-bold tracking-wider">TIKTOK</span>
        </a>

        <!-- Instagram -->
        <a href="https://instagram.com/doyz_asma" target="_blank" class="social-card p-5 rounded-2xl flex flex-col items-center justify-center gap-3 fade-in-up delay-2">
            <span class="material-icons-round text-4xl text-pink-500 icon-box" style="filter: drop-shadow(0 0 5px #ec4899);">camera_alt</span>
            <span class="text-sm font-bold tracking-wider">INSTAGRAM</span>
        </a>

        <!-- WhatsApp -->
        <a href="https://wa.me/6285881599723" target="_blank" class="social-card p-5 rounded-2xl flex flex-col items-center justify-center gap-3 fade-in-up delay-3">
            <span class="material-icons-round text-4xl text-green-500 icon-box" style="filter: drop-shadow(0 0 5px #22c55e);">whatsapp</span>
            <span class="text-sm font-bold tracking-wider">WHATSAPP</span>
        </a>

        <!-- Facebook -->
        <a href="https://facebook.com/" target="_blank" class="social-card p-5 rounded-2xl flex flex-col items-center justify-center gap-3 fade-in-up delay-4">
            <span class="material-icons-round text-4xl text-blue-500 icon-box" style="filter: drop-shadow(0 0 5px #3b82f6);">facebook</span>
            <span class="text-sm font-bold tracking-wider">FACEBOOK</span>
        </a>

        <!-- Telegram -->
        <a href="https://t.me/" target="_blank" class="social-card p-5 rounded-2xl flex flex-col items-center justify-center gap-3 fade-in-up delay-5">
            <span class="material-icons-round text-4xl text-sky-400 icon-box" style="filter: drop-shadow(0 0 5px #38bdf8);">send</span>
            <span class="text-sm font-bold tracking-wider">TELEGRAM</span>
        </a>

        <!-- YouTube -->
        <a href="https://youtube.com/" target="_blank" class="social-card p-5 rounded-2xl flex flex-col items-center justify-center gap-3 fade-in-up delay-6">
            <span class="material-icons-round text-4xl text-red-500 icon-box" style="filter: drop-shadow(0 0 5px #ef4444);">play_circle_filled</span>
            <span class="text-sm font-bold tracking-wider">YOUTUBE</span>
        </a>

    </div>

    <!-- Footer -->
    <div class="mt-12 text-[10px] text-gray-600 font-mono fade-in-up delay-6">
        <p>SYS.CONNECTION // SECURE</p>
        <p class="text-[var(--neon)] mt-1">© 2026 DOYZ</p>
    </div>

</body>
</html>
